name: Play fix6
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/play-fix6.yml"
      - ".github/scripts/patch-plat.py"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/patch-plat.py
      - name: Commit
        run: |
          git config user.name build
          git config user.email build@local
          git add assets/index-cB77LQkQ.js
          git diff --cached --quiet || git commit -m "Paint platforms as dusk ruins, not brick tiles"
          git push
