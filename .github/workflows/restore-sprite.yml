name: Restore sprite
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-sprite.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pillow numpy
      - name: Restore and normalize run frame heights
        run: |
          set -e
          git checkout 2b18302 -- assets/sprites/zf-run-1.png || git checkout 2b183029e0a0e318f0bc9531e36dc5af217e35d4 -- assets/sprites/zf-run-1.png
          rm -f assets/sprites/_binary-test.png assets/sprites/_binary-test2.png
          python3 << 'PY'
          from PIL import Image
          import numpy as np
          from pathlib import Path

          SRC = Path('assets/sprites')
          CAN_W, CAN_H = 480, 640
          FEET_Y = 628
          BODY_CX = 252
          TARGET_H = 515

          def content(a):
              vis = a[:,:,3] > 18
              ys, xs = np.where(vis)
              return int(xs.min()), int(ys.min()), int(xs.max()), int(ys.max())

          def body_cx(a):
              vis = a[:,:,3] > 18
              r,g,b = a[:,:,0].astype(int), a[:,:,1].astype(int), a[:,:,2].astype(int)
              red = vis & (r > 145) & (g < 95) & (b < 100) & (r > g + 50)
              xs_all = np.where(vis)[1]
              mid = int(np.percentile(xs_all, 42)) if xs_all.size else 0
              tassel = red & (np.arange(a.shape[1])[None,:] < mid)
              body = vis & ~tassel
              h = a.shape[0]
              band = body.copy()
              band[:int(h*0.22), :] = False
              band[int(h*0.72):, :] = False
              if not band.any():
                  band = body if body.any() else vis
              _, xs = np.where(band)
              return int(np.median(xs))

          def normalize(path, target_h=TARGET_H):
              im = Image.open(path).convert('RGBA')
              a = np.array(im)
              x0,y0,x1,y1 = content(a)
              crop = a[y0:y1+1, x0:x1+1]
              scale = target_h / float(crop.shape[0])
              new_w = max(1, int(round(crop.shape[1] * scale)))
              new_h = max(1, int(round(crop.shape[0] * scale)))
              scaled = np.array(Image.fromarray(crop, 'RGBA').resize((new_w, new_h), Image.Resampling.LANCZOS))
              cx = body_cx(scaled)
              vis = scaled[:,:,3] > 18
              ys, xs = np.where(vis)
              fy = int(ys.max())
              ox = BODY_CX - cx
              oy = FEET_Y - fy
              canvas = np.zeros((CAN_H, CAN_W, 4), dtype=np.uint8)
              h, w = scaled.shape[:2]
              x0p, y0p = ox, oy
              cx0, cy0 = max(0,x0p), max(0,y0p)
              cx1, cy1 = min(CAN_W,x0p+w), min(CAN_H,y0p+h)
              sx0, sy0 = cx0-x0p, cy0-y0p
              canvas[cy0:cy1, cx0:cx1] = scaled[sy0:sy0+(cy1-cy0), sx0:sx0+(cx1-cx0)]
              Image.fromarray(canvas, 'RGBA').save(path)
              va = np.array(Image.open(path))
              vys, vxs = np.where(va[:,:,3] > 18)
              print(path.name, 'h=', int(vys.max()-vys.min()+1), 'head=', int(vys.min()), 'feet=', int(vys.max()))

          for i in range(1,7):
              normalize(SRC / f'zf-run-{i}.png')
          print('done')
          PY
      - name: Commit
        run: |
          git config user.name 'build'
          git config user.email 'build@local'
          git add -A
          git diff --cached --quiet || git commit -m 'Restore run-1 and lock all run frames to same height'
          git push
