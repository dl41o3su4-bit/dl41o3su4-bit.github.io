name: Play fix2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/play-fix2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix syntax
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('assets/index-cB77LQkQ.js')
          js = p.read_text()
          old = 'this.player.y}},this.coins=0'
          new = 'this.player.y;}}this.coins=0'
          assert old in js, js[js.find('this.coins=0')-80:js.find('this.coins=0')+20]
          js = js.replace(old, new, 1)
          p.write_text(js)
          print('ok')
          PY
      - name: Commit
        run: |
          git config user.name build
          git config user.email build@local
          git add assets/index-cB77LQkQ.js
          git diff --cached --quiet || git commit -m 'Fix JS syntax after spawn plant patch'
          git push
